<!doctype html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><title>Alight build status</title>
<style>body{background:#0b0b12;color:#ddd;font:14px system-ui;padding:16px}h1{color:#7cf;font-size:18px}.s{padding:8px;margin:6px 0;border-radius:8px;background:#161622}.done{border-left:4px solid #4f8}.run{border-left:4px solid #fc4}.todo{border-left:4px solid #555}small{color:#888}</style></head>
<body><h1>Alight Motion clone build</h1><div id=o>Loading…</div><small id=t></small>
<script>async function r(){try{const d=await (await fetch('status.json?'+Date.now())).json();o.innerHTML=d.steps.map(s=>`<div class="s ${s.state}">${s.state=='done'?'✅':s.state=='run'?'⏳':'⬜'} ${s.name}</div>`).join('');t.textContent='Updated '+d.updated}catch(e){o.textContent='No status yet'}}r();setInterval(r,15000)</script></body></html>
